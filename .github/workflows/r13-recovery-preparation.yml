name: R13 recovery source preparation

on:
  pull_request:

permissions:
  contents: read

jobs:
  preparation:
    name: Generate recovery schemas and verify repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Format source and generate from Pydantic
        run: |
          uv run ruff format src/llm_research_os/recovery/models.py src/llm_research_os/recovery/operations.py src/llm_research_os/recovery/backup.py src/llm_research_os/recovery/schema.py src/llm_research_os/cli/contracts.py tests/test_trained_recovery.py
          uv run ruff check --fix src/llm_research_os/recovery/models.py src/llm_research_os/recovery/operations.py src/llm_research_os/recovery/backup.py src/llm_research_os/recovery/schema.py src/llm_research_os/cli/contracts.py tests/test_trained_recovery.py
          uv run ruff format src/llm_research_os/recovery/models.py src/llm_research_os/recovery/operations.py src/llm_research_os/recovery/backup.py src/llm_research_os/recovery/schema.py src/llm_research_os/cli/contracts.py tests/test_trained_recovery.py
          uv run researchos schema --contract backup-manifest-v2 --output schemas/backup-manifest/v0alpha2.schema.json
          uv run researchos schema --contract operations-backup --output schemas/operations-backup/v0alpha1.schema.json
          uv run python - <<'PY'
          import base64
          from pathlib import Path
          paths = ["src/llm_research_os/recovery/models.py","src/llm_research_os/recovery/operations.py","src/llm_research_os/recovery/backup.py","src/llm_research_os/recovery/schema.py","src/llm_research_os/cli/contracts.py","tests/test_trained_recovery.py","schemas/backup-manifest/v0alpha2.schema.json","schemas/operations-backup/v0alpha1.schema.json"]
          for name in paths:
              value = base64.b64encode(Path(name).read_bytes()).decode()
              print('R13_GENERATED_BEGIN:' + name)
              for start in range(0, len(value), 8000):
                  print(value[start:start + 8000])
              print('R13_GENERATED_END:' + name)
          PY
      - name: Check source and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Verify trained recovery and historical recovery
        run: uv run pytest tests/test_trained_recovery.py tests/test_trained_evaluation.py tests/test_recovery_backup.py tests/test_recovery_contracts.py tests/test_application_native.py -q
