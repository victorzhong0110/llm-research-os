name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Verify generated schemas
        run: uv run researchos schema --check schemas/research-spec/v0alpha1.schema.json
      - name: Verify BlockManifest schema
        run: >-
          uv run researchos schema --contract block-manifest
          --check schemas/block-manifest/v0alpha1.schema.json
      - name: Verify block command report schema
        run: >-
          uv run researchos schema --contract block-command-report
          --check schemas/block-command-report/v0alpha1.schema.json
      - name: Verify dry-run report schema
        run: >-
          uv run researchos schema --contract dry-run-report
          --check schemas/dry-run-report/v0alpha1.schema.json
      - name: Verify problem report schema
        run: >-
          uv run researchos schema --contract problem-report
          --check schemas/problem-report/v0alpha1.schema.json
      - name: Verify ResearchEvent schema
        run: >-
          uv run researchos schema --contract research-event
          --check schemas/research-event/v0alpha1.schema.json
      - name: Verify RunSnapshot schema
        run: >-
          uv run researchos schema --contract run-state
          --check schemas/run-state/v0alpha1.schema.json
      - name: Verify SimulationRequest schema
        run: >-
          uv run researchos schema --contract simulation-request
          --check schemas/simulation-request/v0alpha1.schema.json
      - name: Verify RunCancellationRequest schema
        run: >-
          uv run researchos schema --contract run-cancellation-request
          --check schemas/run-cancellation-request/v0alpha1.schema.json
      - name: Verify ArtifactObjectReport schema
        run: >-
          uv run researchos schema --contract artifact-object-report
          --check schemas/artifact-object-report/v0alpha1.schema.json
      - name: Build package
        run: uv build
