name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Python ${{ matrix.python-version }}${{ matrix.experimental && ' (forward-compat, allowed to fail)' || '' }}
    runs-on: ubuntu-latest
    # 3.12 and 3.13 are required (charter §18 decision 2). 3.14 is the
    # forward-compatibility job from chapter 18 §2.2 / ADR-0038 E9 and may fail.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Verify RFC 8785 digest conformance
        run: node conformance/digest/verify.mjs
      - name: Test
        run: uv run pytest
      - name: Verify generated schemas
        run: uv run researchos schema --check-all
      - name: Build package
        run: uv build

  dco:
    name: DCO sign-off (fork pull requests)
    # ADR-0038 E11: external contributions carry a Developer Certificate of
    # Origin 1.1 sign-off on every commit. Enforced only for pull requests
    # whose head repository is a fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fi
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha} lacks a Signed-off-by trailer (Developer Certificate of Origin 1.1)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign each commit with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a DCO sign-off."
