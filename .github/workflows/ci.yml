name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    # Required checks (branch ruleset): Python 3.12 / 3.13 on ubuntu-latest and
    # macos-latest. macOS is the primary development platform and the artifact
    # store relies on dirfd / O_NOFOLLOW / link / fsync semantics that differ by OS.
    # Python 3.14 is the forward-compatibility job (chapter 18 §2.2, ADR-0038 E9)
    # and may fail.
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})${{ matrix.experimental && ' forward-compat, allowed to fail' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Verify RFC 8785 digest conformance
        run: node conformance/digest/verify.mjs
      - name: Test with coverage report
        run: uv run pytest --cov=llm_research_os --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Verify generated schemas
        run: uv run researchos schema --check-all
      - name: Build package
        run: uv build

  dco:
    name: DCO sign-off (fork pull requests)
    # ADR-0038 E11: external contributions carry a Developer Certificate of
    # Origin 1.1 sign-off on every commit. Enforced only for pull requests
    # whose head repository is a fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fi
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha} lacks a Signed-off-by trailer (Developer Certificate of Origin 1.1)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign each commit with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a DCO sign-off."
