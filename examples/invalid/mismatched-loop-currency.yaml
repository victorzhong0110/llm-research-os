apiVersion: researchos.dev/v0alpha1
kind: ResearchProject
metadata:
  id: mismatched-loop-currency
  revision: 1
  title: Loop and resource currencies cannot be compared
resources:
  - id: paid-gpu
    kind: gpu
    paid: true
    maxCost: 5
    currency: USD
    maxWallTimeSeconds: 600
workflows:
  - id: workflow.invalid
    graph:
      nodes:
        - kind: loop
          id: loop
          maxIterations: 2
          mayIncurCost: true
          maxCost: 5
          currency: EUR
          maxWallTimeSeconds: 600
          body:
            nodes:
              - kind: task
                id: train
                blockType: example.train
                blockVersion: 0.1.0
                resourceRefs:
                  - paid-gpu
            edges: []
      edges: []
