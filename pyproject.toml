[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-research-os"
version = "0.0.0"
description = "A model-, training-backend-, and compute-provider-neutral LLM research operating system."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
researchos = "llm_research_os.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_research_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llm_research_os"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
